<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <sticky-header>
        <div class="container">
            <header class="header">
                <div class="header-wpr">
                    <header-drawer class="mob-only" data-breakpoint="tablet">
                        <button class="menu-btn" role="button" aria-label="Menu" aria-controls="menu-drawer">
                            <div class="icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4H21V6H3V4ZM3 11H21V13H3V11ZM3 18H21V20H3V18Z"></path></svg>
                            </div>
                        </button>
                        </header-drawer>
                    <h1 class="header-heading desk-only">
                        <a href="/" class="logo-link">
                            <img src="./images/new-year.png" alt="Logo image">
                        </a>
                    </h1>
                    <div id="menu-drawer" class="header-links">
                        <nav>
                            <div class="mon-nav-close mob-only">
                                <button class="nav-close-btn">
                                    <p>close</p>
                                    <div class="icon"> 
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10.5859 12L2.79297 4.20706L4.20718 2.79285L12.0001 10.5857L19.793 2.79285L21.2072 4.20706L13.4143 12L21.2072 19.7928L19.793 21.2071L12.0001 13.4142L4.20718 21.2071L2.79297 19.7928L10.5859 12Z"></path></svg>
                                    </div>
                                </button>
                            </div>
                            <ul class="nav-ul">
                                <li class="nav-li">
                                    <a href="#" class="nav-link">Home</a>
                                </li>
                                <li class="nav-li">
                                    <a href="#" class="nav-link">About</a>
                                </li>
                                <li class="nav-li">
                                    <a href="#" class="nav-link">Blog</a>
                                </li>
                                <li class="nav-li">
                                    <a href="#" class="nav-link">contact</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                    <div class="header-btn">
                        <a href="#" class="btn primary-btn">Primary btn</a>
                    </div>
                </div>
            </header>
        </div>
    </sticky-header>
    <main>
        <section class="hero-banner-section">
            <div class="hero-banner-outer">
                <div class="banner-image">
                    <div class="aspect-ratio">
                        <img src="https://plus.unsplash.com/premium_photo-1760569669865-1399e4200645?q=80&w=1126&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="img">
                    </div>
                </div>
                <div class="banner-cont">
                    <div class="content-wpr">
                        <div class="content-left"></div>
                        <div class="content-right"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer></footer>

    <script src="js/custom.js"></script>
</body>
</html>
